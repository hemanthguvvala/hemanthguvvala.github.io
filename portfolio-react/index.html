<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f231f" />
    <!-- Send the full URL to our own origin, only the origin cross-site.
         X-Content-Type-Options and frame-ancestors need real HTTP headers,
         which GitHub Pages does not allow us to set. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      Applies the theme before first paint. This must stay inline and blocking:
      loading it as a module would run after the prerendered HTML has painted,
      and a dark-mode visitor would see a white flash on every page load.

      An explicit choice in localStorage wins; otherwise the system preference
      decides. Nothing is written to the DOM unless a choice exists, so the
      CSS media query in theme.css remains in charge by default.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#f6faf8' : '#0f231f');
        } catch (e) {
          /* Storage can be unavailable; the CSS default still applies. */
        }
      })();
    </script>

    <!-- Brand assets. Local files only — never a third-party URL for these. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!--
      Per-route title, description, canonical, Open Graph and JSON-LD are
      injected at the marker below by scripts/prerender.mjs, from the same SEO
      components the SPA uses at runtime. Do not hardcode page metadata in this
      file — it would go stale the moment a route changed.
    -->
    <!--app-head-->

    <!--
      Entrance animations start at opacity:0 and are revealed by JavaScript.
      Without JS that content would render invisible, so force it visible.
    -->
    <noscript>
      <style>
        [style*='opacity:0'],
        [style*='opacity: 0'] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body class="dark">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
