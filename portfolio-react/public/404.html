<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hemanth Kumar Guvvala - Lead Product Engineer</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirect all 404s back to index.html, preserving the path as a query param
      // so the React app can restore the correct route.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + '/?p=' +
        encodeURIComponent(l.pathname.slice(1)) +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
