name: Deploy React Portfolio to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        working-directory: ./portfolio-react
        
      - name: Build
        run: npm run build
        working-directory: ./portfolio-react
        env:
          # Cloudflare Web Analytics beacon token. Set as a repository variable
          # (Settings → Secrets and variables → Actions → Variables) named
          # CF_BEACON_TOKEN. It is not a secret — beacon tokens are visible in
          # the page source of every site that uses them — but keeping it out of
          # the repo means a fork does not report into this site's dashboard.
          # If unset, the beacon simply does not load and the build still passes.
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './portfolio-react/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
